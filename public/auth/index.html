<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipboard - Sign in</title>
<style>
    :root{
        --orange:#f97316;
        --orange-dark:#ea580c;
        --orange-light:#ffedd5;
        --bg:#fff7ed;
        --border:#fed7aa;
        --text:#431407;
        --muted:#9a6b4b;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:16px;
        background:var(--bg);
        color:var(--text);
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    }
    svg.icon{
        width:18px;
        height:18px;
        fill:none;
        stroke:currentColor;
        stroke-width:2;
        stroke-linecap:round;
        stroke-linejoin:round;
        flex-shrink:0;
    }
    .card{
        width:100%;
        max-width:360px;
        background:#fff;
        border:1px solid var(--border);
        border-radius:12px;
        padding:28px 24px;
    }
    .brand{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
        color:var(--orange);
        font-size:22px;
        font-weight:700;
        margin-bottom:20px;
    }
    .brand svg.icon{width:26px;height:26px}
    .tabs{
        display:flex;
        background:var(--orange-light);
        border-radius:8px;
        padding:3px;
        margin-bottom:20px;
    }
    .tabs button{
        flex:1;
        border:none;
        background:none;
        padding:8px;
        border-radius:6px;
        font:inherit;
        font-size:14px;
        color:var(--muted);
        cursor:pointer;
    }
    .tabs button.active{
        background:#fff;
        color:var(--orange-dark);
        font-weight:600;
    }
    .field{
        position:relative;
        margin-bottom:12px;
    }
    .field > svg.icon{
        position:absolute;
        left:12px;
        top:50%;
        transform:translateY(-50%);
        color:var(--orange);
        pointer-events:none;
    }
    .field input{
        width:100%;
        padding:11px 40px 11px 38px;
        border:1px solid var(--border);
        border-radius:8px;
        font:inherit;
        font-size:15px;
        color:var(--text);
        outline:none;
    }
    .field input:focus{
        border-color:var(--orange);
        box-shadow:0 0 0 3px var(--orange-light);
    }
    .field .toggle{
        position:absolute;
        right:6px;
        top:50%;
        transform:translateY(-50%);
        border:none;
        background:none;
        color:var(--muted);
        padding:6px;
        cursor:pointer;
        display:flex;
    }
    .field .toggle:hover{color:var(--orange)}
    .field .toggle .off{display:none}
    .field.shown .toggle .on{display:none}
    .field.shown .toggle .off{display:block}
    .error{
        display:none;
        align-items:center;
        gap:6px;
        color:#c2410c;
        font-size:14px;
        margin-bottom:12px;
    }
    .error.show{display:flex}
    .submit{
        width:100%;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
        padding:11px;
        border:none;
        border-radius:8px;
        background:var(--orange);
        color:#fff;
        font:inherit;
        font-size:15px;
        font-weight:600;
        cursor:pointer;
    }
    .submit:hover{background:var(--orange-dark)}
    .submit:disabled{opacity:.6;cursor:default}
    .submit .i-signup{display:none}
    body[data-mode="signup"] .submit .i-login{display:none}
    body[data-mode="signup"] .submit .i-signup{display:block}
</style>
</head>
<body data-mode="login">
<svg width="0" height="0" style="position:absolute">
    <symbol id="i-clipboard" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></symbol>
    <symbol id="i-log-in" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></symbol>
    <symbol id="i-user-plus" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></symbol>
</svg>

<div class="card">
    <div class="brand">
        <svg class="icon"><use href="#i-clipboard"/></svg>
        Clipboard
    </div>

    <div class="tabs">
        <button type="button" class="active" data-mode="login">Log in</button>
        <button type="button" data-mode="signup">Sign up</button>
    </div>

    <form id="form">
        <div class="field">
            <svg class="icon"><use href="#i-user"/></svg>
            <input id="username" type="text" placeholder="Username" autocomplete="username" required autofocus>
        </div>
        <div class="field" id="passwordField">
            <svg class="icon"><use href="#i-lock"/></svg>
            <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
            <button type="button" class="toggle" id="toggle" aria-label="Show or hide password">
                <svg class="icon on"><use href="#i-eye"/></svg>
                <svg class="icon off"><use href="#i-eye-off"/></svg>
            </button>
        </div>

        <div class="error" id="error">
            <svg class="icon"><use href="#i-alert"/></svg>
            <span id="errorText"></span>
        </div>

        <button type="submit" class="submit" id="submit">
            <svg class="icon i-login"><use href="#i-log-in"/></svg>
            <svg class="icon i-signup"><use href="#i-user-plus"/></svg>
            <span id="submitText">Log in</span>
        </button>
    </form>
</div>

<script>
    let mode = "login";

    const form = document.getElementById("form");
    const username = document.getElementById("username");
    const password = document.getElementById("password");
    const passwordField = document.getElementById("passwordField");
    const error = document.getElementById("error");
    const errorText = document.getElementById("errorText");
    const submit = document.getElementById("submit");
    const submitText = document.getElementById("submitText");

    function showError(message){
        errorText.textContent = message;
        error.classList.toggle("show", !!message);
    }

    document.querySelectorAll(".tabs button").forEach(button => {
        button.addEventListener("click", () => {
            mode = button.dataset.mode;
            document.body.dataset.mode = mode;
            document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b === button));
            submitText.textContent = mode === "login" ? "Log in" : "Sign up";
            password.autocomplete = mode === "login" ? "current-password" : "new-password";
            showError("");
        });
    });

    document.getElementById("toggle").addEventListener("click", () => {
        const show = password.type === "password";
        password.type = show ? "text" : "password";
        passwordField.classList.toggle("shown", show);
    });

    form.addEventListener("submit", async e => {
        e.preventDefault();
        showError("");
        submit.disabled = true;
        try{
            const res = await fetch("/api/auth?mode=" + mode, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username: username.value.trim(), password: password.value})
            });
            const result = await res.json();
            if(result.success){
                location.href = "/";
            }else{
                showError(result.error || "Something went wrong");
            }
        }catch{
            showError("Could not reach the server");
        }
        submit.disabled = false;
    });
</script>
</body>
</html>
