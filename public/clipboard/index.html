<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipboard</title>
<style>
    :root{
        --orange:#f97316;
        --orange-dark:#ea580c;
        --orange-light:#ffedd5;
        --bg:#fff7ed;
        --border:#fed7aa;
        --text:#431407;
        --muted:#9a6b4b;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
        min-height:100vh;
        background:var(--bg);
        color:var(--text);
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    }
    svg.icon{
        width:18px;
        height:18px;
        fill:none;
        stroke:currentColor;
        stroke-width:2;
        stroke-linecap:round;
        stroke-linejoin:round;
        flex-shrink:0;
    }
    header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        padding:12px 20px;
        background:#fff;
        border-bottom:1px solid var(--border);
    }
    .brand{
        display:flex;
        align-items:center;
        gap:8px;
        color:var(--orange);
        font-size:20px;
        font-weight:700;
        text-decoration:none;
    }
    .brand svg.icon{width:24px;height:24px}
    .nav{display:flex;gap:8px}
    button{font:inherit;cursor:pointer}
    .ghost{
        display:flex;
        align-items:center;
        gap:6px;
        border:1px solid var(--border);
        background:#fff;
        color:var(--text);
        padding:6px 10px;
        border-radius:8px;
        font-size:14px;
        text-decoration:none;
    }
    .ghost:hover{
        border-color:var(--orange);
        color:var(--orange-dark);
    }
    .ghost.done{color:#15803d;border-color:#15803d}
    main{
        max-width:720px;
        margin:0 auto;
        padding:24px 16px;
    }
    .card{
        background:#fff;
        border:1px solid var(--border);
        border-radius:12px;
        padding:20px 24px;
    }
    h1{
        font-size:20px;
        overflow-wrap:anywhere;
    }
    .meta{
        display:flex;
        flex-wrap:wrap;
        gap:12px;
        margin-top:8px;
        font-size:13px;
        color:var(--muted);
    }
    .meta span{
        display:flex;
        align-items:center;
        gap:4px;
    }
    .meta svg.icon{
        width:14px;
        height:14px;
        color:var(--orange);
    }
    .text{
        margin-top:16px;
        padding:14px 16px;
        background:var(--bg);
        border:1px solid var(--border);
        border-radius:8px;
        white-space:pre-wrap;
        overflow-wrap:anywhere;
        font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        font-size:14px;
        min-height:80px;
    }
    .actions{
        display:flex;
        gap:8px;
        margin-top:16px;
    }
    .center{
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:8px;
        padding:32px 16px;
        color:var(--muted);
        text-align:center;
    }
    .center svg.icon{
        width:40px;
        height:40px;
        color:var(--orange);
    }
    .field{
        position:relative;
        width:100%;
        max-width:320px;
        margin-top:8px;
    }
    .field > svg.icon{
        position:absolute;
        left:12px;
        top:50%;
        transform:translateY(-50%);
        color:var(--orange);
        pointer-events:none;
    }
    .field input{
        width:100%;
        padding:11px 12px 11px 38px;
        border:1px solid var(--border);
        border-radius:8px;
        font:inherit;
        font-size:15px;
        color:var(--text);
        outline:none;
    }
    .field input:focus{
        border-color:var(--orange);
        box-shadow:0 0 0 3px var(--orange-light);
    }
    .error{
        display:none;
        align-items:center;
        gap:6px;
        color:#c2410c;
        font-size:14px;
    }
    .error.show{display:flex}
    .submit{
        width:100%;
        max-width:320px;
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
        padding:11px;
        border:none;
        border-radius:8px;
        background:var(--orange);
        color:#fff;
        font-size:15px;
        font-weight:600;
    }
    .submit:hover{background:var(--orange-dark)}
    .submit:disabled{opacity:.6;cursor:default}
    .hidden{display:none !important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
    <symbol id="i-clipboard" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></symbol>
</svg>

<header>
    <a class="brand" href="/">
        <svg class="icon"><use href="#i-clipboard"/></svg>
        Clipboard
    </a>
    <div class="nav">
        <a class="ghost hidden" id="editLink" href="#">
            <svg class="icon"><use href="#i-pencil"/></svg>
            Edit
        </a>
        <a class="ghost" id="homeLink" href="/auth/">Sign in</a>
    </div>
</header>

<main>
    <!-- loading / not found / error -->
    <div class="card center" id="message">Loading...</div>

    <!-- password prompt -->
    <div class="card center hidden" id="lock">
        <svg class="icon"><use href="#i-key"/></svg>
        <div>This clipboard is password protected.</div>
        <div class="field">
            <svg class="icon"><use href="#i-lock"/></svg>
            <input id="password" type="password" placeholder="Password" autocomplete="off">
        </div>
        <div class="error" id="lockError">
            <svg class="icon"><use href="#i-alert"/></svg>
            <span></span>
        </div>
        <button class="submit" id="unlock">Unlock</button>
    </div>

    <!-- clipboard -->
    <div class="card hidden" id="view">
        <h1 id="title"></h1>
        <div class="meta">
            <span id="visibility"></span>
            <span id="views"></span>
            <span id="expiry" class="hidden"></span>
        </div>
        <div class="text" id="text"></div>
        <div class="actions">
            <button class="ghost" id="copyText">
                <svg class="icon"><use href="#i-copy"/></svg>
                Copy text
            </button>
            <button class="ghost" id="copyLink">
                <svg class="icon"><use href="#i-copy"/></svg>
                Copy link
            </button>
        </div>
    </div>
</main>

<script>
    const VISIBILITY = [
        {label: "Private", icon: "i-lock"},
        {label: "Public", icon: "i-globe"},
        {label: "Password", icon: "i-key"}
    ];

    const $ = id => document.getElementById(id);
    const id = new URLSearchParams(location.search).get("id");
    let password = "";

    function icon(name){
        return '<svg class="icon"><use href="#' + name + '"/></svg>';
    }

    function show(which){
        for(const name of ["message", "lock", "view"]){
            $(name).classList.toggle("hidden", name !== which);
        }
    }

    function showMessage(text){
        $("message").textContent = text;
        show("message");
    }

    async function load(){
        if(!id){
            return showMessage("No clipboard id given.");
        }
        let res;
        try{
            res = await fetch("/api/get-clipboard?id=" + encodeURIComponent(id), {
                headers: password ? {"x-clipboard-password": encodeURIComponent(password)} : {}
            });
        }catch{
            return showMessage("Could not reach the server.");
        }
        const result = await res.json();

        if(res.status === 401){
            // password needed (or wrong); only show the error after an attempt
            show("lock");
            const err = $("lockError");
            err.classList.toggle("show", password !== "");
            err.querySelector("span").textContent = result.error || "Wrong password";
            $("password").focus();
            return;
        }
        if(!res.ok || !result.success){
            return showMessage(result.error === "Not found" ? "Clipboard not found or expired." : (result.error || "Something went wrong."));
        }
        render(result.data, result.isOwner);
    }

    function render(c, isOwner){
        const vis = VISIBILITY[c.visibility] ?? VISIBILITY[1];
        document.title = c.title + " - Clipboard";
        $("title").textContent = c.title;
        $("text").textContent = c.text;
        $("visibility").innerHTML = icon(vis.icon) + vis.label;
        $("views").innerHTML = icon("i-eye") + c.views + (c.views === 1 ? " view" : " views");
        if(c.expiresAt){
            $("expiry").innerHTML = icon("i-clock") + "Expires " + new Date(c.expiresAt).toLocaleString();
            $("expiry").classList.remove("hidden");
        }
        if(isOwner){
            $("editLink").href = "/clipboard-editor/?id=" + encodeURIComponent(c.id);
            $("editLink").classList.remove("hidden");
            $("homeLink").textContent = "Dashboard";
            $("homeLink").href = "/dashboard/";
        }
        show("view");
    }

    function flash(button, label){
        const old = button.innerHTML;
        button.innerHTML = icon("i-check") + label;
        button.classList.add("done");
        setTimeout(() => {
            button.innerHTML = old;
            button.classList.remove("done");
        }, 1200);
    }

    $("unlock").addEventListener("click", () => {
        password = $("password").value;
        load();
    });
    $("password").addEventListener("keydown", e => {
        if(e.key === "Enter") $("unlock").click();
    });

    $("copyText").addEventListener("click", async e => {
        await navigator.clipboard.writeText($("text").textContent);
        flash(e.currentTarget, "Copied");
    });
    $("copyLink").addEventListener("click", async e => {
        await navigator.clipboard.writeText(location.origin + "/clipboard/?id=" + encodeURIComponent(id));
        flash(e.currentTarget, "Copied");
    });

    load();
</script>
</body>
</html>
