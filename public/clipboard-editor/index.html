<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipboard - Editor</title>
<style>
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff7ed;color:#431407}
    header{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#fff;border-bottom:1px solid #fed7aa}
    header a{color:#ea580c;text-decoration:none}
    .layout{display:flex;min-height:calc(100vh - 45px)}
    aside{width:240px;padding:12px;background:#fff;border-right:1px solid #fed7aa}
    aside button{width:100%;margin-bottom:8px}
    .item{padding:8px;border-radius:6px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .item:hover{background:#ffedd5}
    .item.active{background:#fed7aa;font-weight:600}
    main{flex:1;padding:20px;max-width:700px}
    label{display:block;margin:12px 0 4px;font-size:14px;color:#9a6b4b}
    input,select,textarea{width:100%;padding:8px;border:1px solid #fed7aa;border-radius:6px;font:inherit}
    textarea{height:240px;resize:vertical}
    button{padding:8px 14px;border:1px solid #f97316;border-radius:6px;background:#fff;color:#ea580c;font:inherit;cursor:pointer}
    button.primary{background:#f97316;color:#fff}
    button.danger{color:#b91c1c;border-color:#b91c1c}
    .row{display:flex;gap:8px;margin-top:16px;align-items:center}
    #status{font-size:14px;color:#9a6b4b}
    #share{margin-top:16px;font-size:14px}
    .hidden{display:none}
</style>
</head>
<body>
<header>
    <strong>Clipboard Editor</strong>
    <a href="/dashboard/">Dashboard</a>
</header>
<div class="layout">
    <aside>
        <button class="primary" id="new">+ New</button>
        <div id="list"></div>
    </aside>
    <main>
        <div id="empty">Select a clipboard or create a new one.</div>
        <div id="panel" class="hidden">
            <label>Title</label>
            <input id="title">
            <label>Text</label>
            <textarea id="text"></textarea>
            <label>Visibility</label>
            <select id="visibility">
                <option value="0">Private</option>
                <option value="1">Public</option>
                <option value="2">Password</option>
            </select>
            <div id="pwBox" class="hidden">
                <label>Password (leave blank to keep the current one)</label>
                <input id="password" type="password" autocomplete="new-password">
            </div>
            <label>Expires at (optional)</label>
            <input id="expires" type="datetime-local">
            <div class="row">
                <button class="primary" id="save">Save</button>
                <button class="danger" id="delete">Delete</button>
                <span id="status"></span>
            </div>
            <div id="share">Share link: <a id="link" target="_blank"></a></div>
        </div>
    </main>
</div>

<script>
    const $ = id => document.getElementById(id);
    let currentId = new URLSearchParams(location.search).get("id");

    async function api(url, method = "GET", body){
        const res = await fetch(url, {
            method,
            headers: body ? {"Content-Type": "application/json"} : {},
            body: body ? JSON.stringify(body) : undefined
        });
        if(res.status === 401){
            location.href = "/auth/";
            throw new Error("Unauthorized");
        }
        return res.json();
    }

    function setStatus(msg){
        $("status").textContent = msg;
    }

    // datetime-local needs "YYYY-MM-DDTHH:mm" in local time
    function toInput(ms){
        if(!ms) return "";
        const d = new Date(ms - new Date(ms).getTimezoneOffset() * 60000);
        return d.toISOString().slice(0, 16);
    }

    async function loadList(){
        const result = await api("/api/list-clipboard");
        $("list").innerHTML = "";
        for(const c of result.data.slice().reverse()){
            const div = document.createElement("div");
            div.className = "item" + (c.id === currentId ? " active" : "");
            div.textContent = c.title || "Untitled";
            div.onclick = () => openClipboard(c.id);
            $("list").appendChild(div);
        }
    }

    async function openClipboard(id){
        const result = await api("/api/edit-clipboard?id=" + encodeURIComponent(id));
        if(!result.success){
            currentId = null;
            $("panel").classList.add("hidden");
            $("empty").classList.remove("hidden");
            $("empty").textContent = result.error || "Not found";
            return;
        }
        const c = result.data;
        currentId = c.id;
        history.replaceState(null, "", "?id=" + encodeURIComponent(c.id));
        $("title").value = c.title;
        $("text").value = c.text;
        $("visibility").value = c.visibility;
        $("password").value = "";
        $("expires").value = toInput(c.expiresAt);
        $("pwBox").classList.toggle("hidden", c.visibility !== 2);
        const url = location.origin + "/clipboard/?id=" + encodeURIComponent(c.id);
        $("link").textContent = url;
        $("link").href = url;
        $("empty").classList.add("hidden");
        $("panel").classList.remove("hidden");
        setStatus("");
        loadList();
    }

    $("visibility").onchange = () => {
        $("pwBox").classList.toggle("hidden", $("visibility").value !== "2");
    };

    $("new").onclick = async () => {
        const result = await api("/api/create-clipboard", "POST");
        if(result.success) openClipboard(result.data.id);
    };

    $("save").onclick = async () => {
        const visibility = Number($("visibility").value);
        const body = {
            title: $("title").value,
            text: $("text").value,
            visibility,
            expiresAt: $("expires").value ? new Date($("expires").value).getTime() : 0
        };
        if(visibility === 2 && $("password").value){
            body.password = $("password").value;
        }
        const result = await api("/api/save-clipboard?id=" + encodeURIComponent(currentId), "POST", body);
        setStatus(result.success ? "Saved" : (result.error || "Save failed"));
        if(result.success){
            $("password").value = "";
            loadList();
        }
    };

    $("delete").onclick = async () => {
        if(!confirm("Delete this clipboard?")) return;
        const result = await api("/api/delete-clipboard?id=" + encodeURIComponent(currentId), "POST");
        if(!result.success){
            setStatus(result.error || "Delete failed");
            return;
        }
        currentId = null;
        history.replaceState(null, "", location.pathname);
        $("panel").classList.add("hidden");
        $("empty").classList.remove("hidden");
        $("empty").textContent = "Deleted. Select a clipboard or create a new one.";
        loadList();
    };

    loadList();
    if(currentId) openClipboard(currentId);
</script>
</body>
</html>
