<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipboard - Dashboard</title>
<style>
    :root{
        --orange:#f97316;
        --orange-dark:#ea580c;
        --orange-light:#ffedd5;
        --bg:#fff7ed;
        --border:#fed7aa;
        --text:#431407;
        --muted:#9a6b4b;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
        min-height:100vh;
        background:var(--bg);
        color:var(--text);
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    }
    svg.icon{
        width:18px;
        height:18px;
        fill:none;
        stroke:currentColor;
        stroke-width:2;
        stroke-linecap:round;
        stroke-linejoin:round;
        flex-shrink:0;
    }
    header{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        padding:12px 20px;
        background:#fff;
        border-bottom:1px solid var(--border);
    }
    .brand{
        display:flex;
        align-items:center;
        gap:8px;
        color:var(--orange);
        font-size:20px;
        font-weight:700;
    }
    .brand svg.icon{width:24px;height:24px}
    .user{
        display:flex;
        align-items:center;
        gap:12px;
        font-size:14px;
        color:var(--muted);
    }
    .user .name{
        display:flex;
        align-items:center;
        gap:6px;
    }
    button{
        font:inherit;
        cursor:pointer;
    }
    .ghost{
        display:flex;
        align-items:center;
        gap:6px;
        border:1px solid var(--border);
        background:#fff;
        color:var(--text);
        padding:6px 10px;
        border-radius:8px;
        font-size:14px;
    }
    .ghost:hover{
        border-color:var(--orange);
        color:var(--orange-dark);
    }
    main{
        max-width:720px;
        margin:0 auto;
        padding:24px 16px;
    }
    .bar{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        margin-bottom:16px;
    }
    h1{
        font-size:20px;
    }
    .primary{
        display:flex;
        align-items:center;
        gap:6px;
        border:none;
        background:var(--orange);
        color:#fff;
        padding:9px 14px;
        border-radius:8px;
        font-size:14px;
        font-weight:600;
    }
    .primary:hover{background:var(--orange-dark)}
    .primary:disabled{opacity:.6;cursor:default}
    .item{
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:12px;
        background:#fff;
        border:1px solid var(--border);
        border-radius:10px;
        padding:14px 16px;
        margin-bottom:10px;
    }
    .item:hover{border-color:var(--orange)}
    .info{min-width:0}
    .title{
        display:block;
        color:var(--text);
        font-weight:600;
        text-decoration:none;
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }
    .title:hover{color:var(--orange-dark)}
    .preview{
        margin-top:2px;
        font-size:14px;
        color:var(--muted);
        overflow:hidden;
        text-overflow:ellipsis;
        white-space:nowrap;
    }
    .meta{
        display:flex;
        flex-wrap:wrap;
        gap:12px;
        margin-top:8px;
        font-size:13px;
        color:var(--muted);
    }
    .meta span{
        display:flex;
        align-items:center;
        gap:4px;
    }
    .meta svg.icon{
        width:14px;
        height:14px;
        color:var(--orange);
    }
    .actions{
        display:flex;
        gap:4px;
        flex-shrink:0;
    }
    .actions button, .actions a{
        display:flex;
        align-items:center;
        justify-content:center;
        width:34px;
        height:34px;
        border:none;
        background:none;
        border-radius:8px;
        color:var(--muted);
    }
    .actions button:hover, .actions a:hover{
        background:var(--orange-light);
        color:var(--orange-dark);
    }
    .actions .danger:hover{
        background:#fee2e2;
        color:#b91c1c;
    }
    .actions .done{color:#15803d}
    .empty{
        display:none;
        flex-direction:column;
        align-items:center;
        gap:8px;
        padding:48px 16px;
        color:var(--muted);
        text-align:center;
    }
    .empty.show{display:flex}
    .empty svg.icon{
        width:40px;
        height:40px;
        color:var(--orange);
    }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
    <symbol id="i-clipboard" viewBox="0 0 24 24"><rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-log-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
</svg>

<header>
    <div class="brand">
        <svg class="icon"><use href="#i-clipboard"/></svg>
        Clipboard
    </div>
    <div class="user">
        <span class="name"><svg class="icon"><use href="#i-user"/></svg><span id="username"></span></span>
        <button class="ghost" id="logout">
            <svg class="icon"><use href="#i-log-out"/></svg>
            Log out
        </button>
    </div>
</header>

<main>
    <div class="bar">
        <h1>My clipboards</h1>
        <button class="primary" id="new">
            <svg class="icon"><use href="#i-plus"/></svg>
            New clipboard
        </button>
    </div>
    <div id="list"></div>
    <div class="empty" id="empty">
        <svg class="icon"><use href="#i-clipboard"/></svg>
        <div>No clipboards yet. Create your first one.</div>
    </div>
</main>

<script>
    const VISIBILITY = [
        {label: "Private", icon: "i-lock"},
        {label: "Public", icon: "i-globe"},
        {label: "Password", icon: "i-key"}
    ];

    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const newButton = document.getElementById("new");

    function icon(name){
        return '<svg class="icon"><use href="#' + name + '"/></svg>';
    }

    function esc(value){
        const div = document.createElement("div");
        div.textContent = value ?? "";
        return div.innerHTML;
    }

    async function api(url, method = "GET"){
        const res = await fetch(url, {method});
        if(res.status === 401){
            location.href = "/auth/";
            throw new Error("Unauthorized");
        }
        return res.json();
    }

    function expiryText(expiresAt){
        if(!expiresAt) return "";
        if(expiresAt < Date.now()) return "Expired";
        return "Expires " + new Date(expiresAt).toLocaleDateString();
    }

    function render(clipboards){
        empty.classList.toggle("show", clipboards.length === 0);
        list.innerHTML = clipboards.map(c => {
            const vis = VISIBILITY[c.visibility] ?? VISIBILITY[1];
            const expiry = expiryText(c.expiresAt);
            const id = encodeURIComponent(c.id);
            return '<div class="item">' +
                '<div class="info">' +
                    '<a class="title" href="/clipboard-editor/?id=' + id + '">' + esc(c.title) + '</a>' +
                    '<div class="preview">' + (esc(c.text.slice(0, 100)) || "Empty") + '</div>' +
                    '<div class="meta">' +
                        '<span>' + icon(vis.icon) + vis.label + '</span>' +
                        '<span>' + icon("i-eye") + c.views + (c.views === 1 ? " view" : " views") + '</span>' +
                        (expiry ? '<span>' + icon("i-clock") + expiry + '</span>' : "") +
                    '</div>' +
                '</div>' +
                '<div class="actions">' +
                    '<a href="/clipboard/?id=' + id + '" title="Open">' + icon("i-external") + '</a>' +
                    '<button data-act="copy" data-id="' + esc(c.id) + '" title="Copy link">' + icon("i-copy") + '</button>' +
                    '<a href="/clipboard-editor/?id=' + id + '" title="Edit">' + icon("i-pencil") + '</a>' +
                    '<button class="danger" data-act="delete" data-id="' + esc(c.id) + '" title="Delete">' + icon("i-trash") + '</button>' +
                '</div>' +
            '</div>';
        }).join("");
    }

    async function load(){
        const result = await api("/api/list-clipboard");
        document.getElementById("username").textContent = result.username;
        render(result.data.slice().reverse());
    }

    newButton.addEventListener("click", async () => {
        newButton.disabled = true;
        const result = await api("/api/create-clipboard", "POST");
        if(result.success){
            location.href = "/clipboard-editor/?id=" + encodeURIComponent(result.data.id);
        }else{
            newButton.disabled = false;
        }
    });

    document.getElementById("logout").addEventListener("click", async () => {
        await fetch("/api/logout", {method: "POST"});
        location.href = "/auth/";
    });

    list.addEventListener("click", async e => {
        const button = e.target.closest("button[data-act]");
        if(!button) return;
        const id = button.dataset.id;
        if(button.dataset.act === "copy"){
            await navigator.clipboard.writeText(location.origin + "/clipboard/?id=" + encodeURIComponent(id));
            button.innerHTML = icon("i-check");
            button.classList.add("done");
            setTimeout(() => {
                button.innerHTML = icon("i-copy");
                button.classList.remove("done");
            }, 1200);
        }
        if(button.dataset.act === "delete"){
            if(!confirm("Delete this clipboard?")) return;
            await api("/api/delete-clipboard?id=" + encodeURIComponent(id), "POST");
            load();
        }
    });

    load();
</script>
</body>
</html>
