<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipboard</title>
<style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
        min-height:100vh;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:16px;
        padding:20px;
        text-align:center;
        background:#fff7ed;
        color:#431407;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    }
    h1{font-size:40px;color:#f97316}
    p{max-width:420px;color:#9a6b4b}
    a{
        padding:10px 22px;
        border-radius:6px;
        background:#f97316;
        color:#fff;
        text-decoration:none;
    }
    a:hover{background:#ea580c}
</style>
</head>
<body>
    <h1>Clipboard</h1>
    <p>Write text, set who can see it, and share it with a link. Keep it private, public, or password-protected.</p>
    <a href="/auth/">Get started</a>
</body>
</html>
